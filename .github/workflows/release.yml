# For each v* tag (made by `just release`): checks the tag matches the
# manifest's version, runs every check, submits the version to
# addons.mozilla.org for review, and makes a GitHub release with the unsigned
# build. Mozilla signs it and publishes it on AMO once it's reviewed.
#
# Needs the repository secrets AMO_API_KEY and AMO_API_SECRET (the JWT issuer
# and secret from https://addons.mozilla.org/developers/addon/api/key/).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Checkout leaves the tag without its message, which is the release notes.
      - run: git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: extractions/setup-just@v4
      # The runner image keeps geckodriver here.
      - run: echo "$GECKOWEBDRIVER" >> "$GITHUB_PATH"
      - run: just setup
      - name: Check the tag matches the manifest
        run: test "v$(node -p 'require("./extension/manifest.json").version')" = "$GITHUB_REF_NAME"
      - run: just check
      - name: Submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: just amo-submit "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          xpi="dist/siderail-$GITHUB_REF_NAME-unsigned.xpi"
          cp dist/siderail.xpi "$xpi"
          {
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo
            echo "Install it from [addons.mozilla.org](https://addons.mozilla.org/firefox/addon/siderail/) once Mozilla has reviewed this version. The attached build is unsigned: Firefox only loads it temporarily (about:debugging) or in Developer Edition and Nightly."
          } > dist/notes.md
          gh release create "$GITHUB_REF_NAME" "$xpi" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
