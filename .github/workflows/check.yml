# Runs `just check` (lint, unit and e2e tests) with the Firefox and
# geckodriver that come with GitHub's Ubuntu runner.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: extractions/setup-just@v4
      # The runner image keeps geckodriver here.
      - run: echo "$GECKOWEBDRIVER" >> "$GITHUB_PATH"
      - run: just setup
      - run: just check
