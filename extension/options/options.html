<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Siderail options</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="options.css">
  <script type="module" src="options.js"></script>
</head>
<body>
  <main>
    <h1>Siderail</h1>
    <h2>Back up your sites</h2>
    <p>Export saves your list to a file, icons included. Import it on another computer, or here after reinstalling.</p>
    <p>Import adds the file’s sites to your list. A site you already have, with the same address, is replaced.</p>
    <div class="row">
      <button id="export" type="button">Export</button>
      <button id="import" type="button">Import…</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </div>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
